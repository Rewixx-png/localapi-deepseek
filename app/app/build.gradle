plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.localapi.deepseek'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.localapi.deepseek'
        minSdk 26
        targetSdk 35
        versionCode 64
        versionName '1.11.3'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            // Builds an unsigned release APK; sign it with your own keystore.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
