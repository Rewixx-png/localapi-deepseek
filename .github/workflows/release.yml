name: Build & Release APK

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages & NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh release

      - name: Run Android unit tests
        working-directory: app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release asset
        id: pkg
        run: |
          cp app/app/build/outputs/apk/release/app-release.apk LocalApiDeepSeek.apk
          SHA=$(sha256sum LocalApiDeepSeek.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA"

      - name: Upload workflow artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LocalApiDeepSeek-release-apk
          path: LocalApiDeepSeek.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: LocalApiDeepSeek.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update update.json on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          APK_SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export VERSION_CODE=$(python3 -c "import re; s=open('app/app/build.gradle').read(); print(re.search(r'versionCode\s+(\d+)', s).group(1))")
          export VERSION_NAME=$(python3 -c "import re; s=open('app/app/build.gradle').read(); print(re.search(r\"versionName\s+'([^']+)'\", s).group(1))")

          git fetch origin main
          git checkout -B main origin/main

          python3 - << 'PY'
          import json, os
          with open('update.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['versionCode'] = int(os.environ['VERSION_CODE'])
          data['versionName'] = os.environ['VERSION_NAME']
          data['url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/LocalApiDeepSeek.apk"
          data['sha256'] = os.environ['APK_SHA256']
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          if ! git diff --quiet update.json; then
            git add update.json
            git commit -m "chore: update update.json for ${TAG} [skip ci]"
            git push origin main
          fi
