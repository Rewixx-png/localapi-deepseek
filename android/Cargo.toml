[package]
name = "localapi-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JNI bridge between the Android shell and deepseek-core"

[lib]
name = "localapi"
crate-type = ["cdylib"]

[dependencies]
deepseek-core = { path = "../core" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
